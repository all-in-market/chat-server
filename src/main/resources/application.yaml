spring:
  application:
    name: all-in-market
  sql:
    init:
      mode: always
  datasource: # 환경 변수가 설정되어 있으면 그 값을 쓰고, 없으면 기본값을 쓴다.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:allinmarket}?reWriteBatchedInserts=true
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
#    defer-datasource-initialization: true

  autoconfigure:
    exclude:
      - org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000} # 하루

server:
  port: 8082

seller:
  email: ${SELLER_ID}
  password: ${SELLER_PASSWORD}

app:
  init:
    admin:
      enabled: false

api:
  server:
    url: ${API_SERVER_URL:http://localhost:8080}

langchain4j:
  open-ai:
    chat-model:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      model-name: deepseek-chat
    streaming-chat-model:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      model-name: deepseek-chat
    moderation-model:
      api-key: ${OPENAI_API_KEY}
      model-name: omni-moderation-latest
    embedding-model:
      api-key: ${OPENAI_API_KEY}
      model-name: text-embedding-3-small
  pgvector:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    database: ${DB_NAME:allinmarket}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    dimension: 1536
    create-table: false



